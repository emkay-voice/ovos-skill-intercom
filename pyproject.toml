[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-intercom"
version = "0.2.0a1"
description = "LAN intercom - send a spoken message to a named OVOS device on the same local network. Fully offline, no internet needed. Speak-only, never executes commands on the receiving device."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Andreas Lorensen"}]
requires-python = ">=3.10"
keywords = ["ovos", "openvoiceos", "skill", "voice", "assistant", "intercom", "multi-device", "messaging", "lan", "emkay"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "ovos-workshop>=0.0.15,<10.0.0",
    "zeroconf",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/emkay-voice/ovos-skill-intercom"
Issues = "https://github.com/emkay-voice/ovos-skill-intercom/issues"
Emkay = "https://github.com/emkay-voice/emkay"
Icon = "https://raw.githubusercontent.com/emkay-voice/ovos-skill-intercom/main/icon.png"

[project.entry-points."opm.skill"]
"ovos-skill-intercom.emkay-voice" = "ovos_skill_intercom:Intercom"

[tool.setuptools]
packages = ["ovos_skill_intercom"]

[tool.setuptools.package-dir]
ovos_skill_intercom = ""

[tool.setuptools.package-data]
ovos_skill_intercom = ["locale/**/*", "*.png"]
